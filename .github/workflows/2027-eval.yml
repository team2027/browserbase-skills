name: 2027 eval
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  statuses: write
  contents: read

env:
  PROMPT_ID: 5e562ebf-fa8e-43f7-b0ec-b53aaa34490f

jobs:
  eval:
    if: "contains(github.event.pull_request.labels.*.name, 'trigger: preview')"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Compute skillsInstall + url-map proxy host
        id: skills
        env:
          SHA:  ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:12}"
          ORG="${REPO%/*}"   # e.g. team2027
          NAME="${REPO#*/}"  # e.g. browserbase-skills
          # Agent sees the canonical-looking install URL; URL_MAP rewrites
          # skills.browserbase.com → <sha>--<org>--<repo>.2027.ax (Cloudflare
          # Worker that serves .well-known/skills/* from raw.githubusercontent
          # /<org>/<repo>/<sha>/...).
          # Worker source: https://github.com/team2027/skills-proxy
          echo "install=npx -y skills add https://skills.browserbase.com" >> "$GITHUB_OUTPUT"
          echo "proxy_host=https://${SHORT_SHA}--${ORG}--${NAME}.2027.ax" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        # team2027/evals-action @ main (post-PR #15 — blockquote mapping with → arrow). SHA-pinned per GitHub's hardening guidance.
        uses: team2027/evals-action@4a6fba5bf4201a5f7d43cd443e82fa0e6d61bd2b
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          url-map: |
            { "skills.browserbase.com": "${{ steps.skills.outputs.proxy_host }}" }
          template-vars: |
            { "skillsInstall": "${{ steps.skills.outputs.install }}" }
          wait-timeout-minutes: 60
