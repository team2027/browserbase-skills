name: 2027 eval
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  statuses: write
  contents: write  # need write to force-update refs/heads/2027/preview

env:
  PROMPT_ID: 5e562ebf-fa8e-43f7-b0ec-b53aaa34490f

jobs:
  eval:
    if: "contains(github.event.pull_request.labels.*.name, 'trigger: preview')"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      # Force-update refs/heads/2027/preview to this PR's HEAD sha so the
      # install command can pin to a stable, release-channel-flavored ref
      # instead of a PR-derivative branch name like 'feat/extraction-filter'.
      # Hypothesis: the per-PR ref triggers a "this is a dev branch" persona
      # in the agent that surfaces as DNF on credential-blocked tasks.
      - name: Move 2027/preview ref to this PR HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Try patch first (ref exists); fall back to create if 404.
          if ! gh api -X PATCH "repos/${REPO}/git/refs/heads/2027/preview" \
                 -f sha="$SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/2027/preview" -f sha="$SHA" >/dev/null
          fi
          echo "2027/preview now points at ${SHA}"

      - name: Compute skillsInstall
        id: skills
        env:
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # EXPERIMENT: drop the #<ref> suffix entirely to test the "ref name
          # triggers dev mode" hypothesis. Agent gets fork main (= upstream
          # main, clean skill content). Compare completion + interruption
          # counts vs PR runs that had a ref.
          echo "install=npx -y skills add ${REPO}" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        # team2027/evals-action@v0.6.0 — SHA-pinned per GitHub's hardening guidance.
        uses: team2027/evals-action@f9c25786d4e14756afa82bca91fbe0a43cf73ef3
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          # Dummy url-map: server requires non-empty urlMap even when
          # template-vars is set. No-op rewrite of docs.browserbase.com.
          url-map: |
            { "docs.browserbase.com": "https://docs.browserbase.com" }
          template-vars: |
            { "skillsInstall": "${{ steps.skills.outputs.install }}" }
          wait-timeout-minutes: 60
