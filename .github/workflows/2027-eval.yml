name: 2027 eval
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  statuses: write
  contents: read

env:
  PROMPT_ID: 5e562ebf-fa8e-43f7-b0ec-b53aaa34490f

jobs:
  eval:
    if: "contains(github.event.pull_request.labels.*.name, 'trigger: preview')"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Compute skillsInstall + url-map proxy host
        id: skills
        env:
          SHA:  ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:12}"
          ORG="${REPO%/*}"   # e.g. team2027
          NAME="${REPO#*/}"  # e.g. browserbase-skills
          # Workaround for canary-env#88 (merged but not redeployed): point
          # the agent directly at the .2027.ax worker URL and skip URL_MAP
          # interception. Agent loses the canonical-URL veneer but the install
          # actually succeeds, so we get real data on credential-ask behavior.
          # When canary-env redeploys, swap install back to the canonical
          # skills.browserbase.com URL and url-map this same proxy_host.
          # Worker source: https://github.com/team2027/skills-proxy
          PROXY="https://${SHORT_SHA}--${ORG}--${NAME}.2027.ax"
          echo "install=npx -y skills add ${PROXY}" >> "$GITHUB_OUTPUT"
          echo "proxy_host=${PROXY}" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        # team2027/evals-action@v0.6.0 — SHA-pinned per GitHub's hardening guidance.
        uses: team2027/evals-action@f9c25786d4e14756afa82bca91fbe0a43cf73ef3
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          # Dummy entry to satisfy server's non-empty-urlMap validation;
          # not used by the agent since the install URL is the proxy host
          # itself. Drop and re-enable real mapping after canary-env redeploys.
          url-map: |
            { "docs.browserbase.com": "https://docs.browserbase.com" }
          template-vars: |
            { "skillsInstall": "${{ steps.skills.outputs.install }}" }
          wait-timeout-minutes: 60
