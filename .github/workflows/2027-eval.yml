name: 2027 eval
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  statuses: write
  contents: read

env:
  PROMPT_ID: 5e562ebf-fa8e-43f7-b0ec-b53aaa34490f

jobs:
  eval:
    if: "contains(github.event.pull_request.labels.*.name, 'trigger: preview')"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Compute skillsInstall + url-map proxy host
        id: skills
        env:
          SHA:  ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:12}"
          ORG="${REPO%/*}"   # e.g. team2027
          NAME="${REPO#*/}"  # e.g. browserbase-skills
          # EXPERIMENT: drop the https:// prefix from url-map target so
          # entrypoint.sh's `reverse_proxy https://$STAGING` produces a valid
          # Caddyfile (avoids the canary-env#88 double-https bug).
          # Agent sees the clean canonical URL; URL_MAP rewrites host-only.
          echo "install=npx -y skills add https://skills.browserbase.com" >> "$GITHUB_OUTPUT"
          echo "proxy_host=${SHORT_SHA}--${ORG}--${NAME}.2027.ax" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        # team2027/evals-action@v0.6.0 — SHA-pinned per GitHub's hardening guidance.
        uses: team2027/evals-action@f9c25786d4e14756afa82bca91fbe0a43cf73ef3
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          url-map: |
            { "skills.browserbase.com": "${{ steps.skills.outputs.proxy_host }}" }
          template-vars: |
            { "skillsInstall": "${{ steps.skills.outputs.install }}" }
          wait-timeout-minutes: 60
